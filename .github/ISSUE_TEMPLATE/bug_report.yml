name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project board
        2. Drag a task to another status column
        3. Reopen the board
  - type: input
    id: low-level-kanban-version
    attributes:
      label: Low Level Kanban version
      description: Settings > Community plugins, or the version in the installed manifest.json.
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version and platform
      placeholder: 1.13.2, Windows / macOS / Linux / iOS / Android
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: The task or project note that triggers it, console errors (Ctrl+Shift+I on desktop), other plugins involved, sync setup.
